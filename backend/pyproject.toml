[project]
name = "download-cache-api"
version = "0.1.0"
description = "Private download/cache platform backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.29.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.2.1",
  "email-validator>=2.1.1",
  "sqlalchemy[asyncio]>=2.0.29",
  "asyncpg>=0.29.0",
  "alembic>=1.13.1",
  "bcrypt>=4.1.0",
  "pyjwt>=2.8.0",
  "qbittorrent-api>=2024.3.60",
  "slowapi>=0.1.9",
  "structlog>=24.1.0",
  "psutil>=5.9.8",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.1.1",
  "pytest-asyncio>=0.23.6",
  "pytest-cov>=5.0.0",
  "httpx>=0.27.0",
  "ruff>=0.4.1",
  "mypy>=1.9.0",
  "aiosqlite>=0.20.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["UP042"]  # (str, Enum) is intentional here, not enum.StrEnum

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.params.Depends"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
disallow_untyped_defs = false
